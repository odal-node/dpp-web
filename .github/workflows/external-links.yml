name: External links

# Checks every link from the built sites to another site (EUR-Lex acts, GitHub
# files, standards bodies) once a week. Not a pull-request gate: whether a
# third-party page answers is not a property of a pull request, and a host that
# is briefly down would redden unrelated work. It fails only on a certain 404
# or 410; refusals, rate limits and timeouts are listed in the log, not failed
# on. See scripts/check-external-links.mjs.

on:
  schedule:
    # Mondays 04:41 UTC, off the hour and clear of the nightly API-spec sync.
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Check external links
        run: pnpm run check:external
