name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Check
        run: pnpm -r check
      # llms.txt is a hand-written index of pages worth reading, and nothing
      # else parses it — it is a static file in public/, so no build step and
      # no link checker reaches it. Runs after the build because it compares
      # each URL against dist/, which is the artifact actually deployed.
      - name: llms.txt points only at pages that were built
        run: pnpm run check:llms
