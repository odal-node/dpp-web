name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. Every job here reads the tree, installs
# dependencies and builds; none of them needs a token that can write, and
# without this block they inherit the repository default.
permissions:
  contents: read

# Cancel a superseded run rather than paying for it — a rebase or a follow-up
# push makes the in-flight run answer a question nobody is asking any more.
# `main` is excluded: the post-merge run is the record for that commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Check
        run: pnpm -r check
