name: Purge Cloudflare cache

# Cloudflare Pages builds and publishes both sites itself, from its own Git
# integration; nothing here deploys. This only purges the zone's cache.
#
# Manual on purpose. It used to run on every push to main, which is the moment
# Pages *starts* building, so the purge landed before the new build was live
# and cleared nothing that mattered. Run it after a Pages deployment has
# finished, and only if a page still shows old content. The hashed files under
# /_astro get new names with every build; whether Pages also serves fresh HTML
# after each deployment without a purge is worth confirming once, after one
# promotion to main, and if it does this workflow can go.
on:
  workflow_dispatch:

# Every call goes to Cloudflare with its own token; the job reads nothing from
# this repository, so its GitHub token gets no permissions at all.
permissions: {}

jobs:
  purge-cloudflare-cache-landing:
    name: Purge Cloudflare Cache (landing)
    runs-on: ubuntu-latest
    environment: ${{ vars.CLOUDFLARE_ENVIRONMENT_LANDING || 'landing' }}

    steps:
      - name: Check Cloudflare secrets
        id: cloudflare
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_ZONE_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge Cloudflare cache
        if: steps.cloudflare.outputs.ready == 'true'
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      - name: Skip purge if secrets are missing
        if: steps.cloudflare.outputs.ready != 'true'
        run: echo "Skipping Cloudflare cache purge because the required secrets are not configured for the landing environment."

  purge-cloudflare-cache-docs:
    name: Purge Cloudflare Cache (docs)
    runs-on: ubuntu-latest
    environment: ${{ vars.CLOUDFLARE_ENVIRONMENT_DOCS || 'docs' }}

    steps:
      - name: Check Cloudflare secrets
        id: cloudflare
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_ZONE_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge Cloudflare cache
        if: steps.cloudflare.outputs.ready == 'true'
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      - name: Skip purge if secrets are missing
        if: steps.cloudflare.outputs.ready != 'true'
        run: echo "Skipping Cloudflare cache purge because the required secrets are not configured for the docs environment."