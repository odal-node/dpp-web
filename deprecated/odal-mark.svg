<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">Odal Node — open door beneath a constellation</title>
  <!-- Ice-blue mark for dark backgrounds. Geometry: outer ring, hand-drawn pointed-arch
       doorway, constellation of linked stars. Companion: odal-mark-navy.svg (light bg). -->
  <g fill="none" stroke="#B7D4F0" stroke-linecap="round" stroke-linejoin="round">

    <!-- outer ring -->
    <circle cx="256" cy="256" r="230" stroke-width="17"/>

    <!-- doorway: outer frame (slight wobble for the hand-drawn feel) -->
    <path stroke-width="8" d="M191 354
             Q189 296 191 232
             Q190 228 194 224
             L250 174
             Q256 169 262 174
             L318 224
             Q322 228 321 233
             Q323 297 321 354"/>
    <!-- doorway: inner opening line -->
    <path stroke-width="3.5" d="M206 354
             Q205 300 206 240
             L256 196
             L306 240
             Q307 301 306 354" opacity="0.9"/>
    <!-- sketch re-strokes on the jambs and peak -->
    <path stroke-width="2" opacity="0.55" d="M197 350 Q196 295 198 236"/>
    <path stroke-width="2" opacity="0.55" d="M315 348 Q316 296 314 238"/>
    <path stroke-width="2" opacity="0.5" d="M249 180 L256 173 L264 181"/>

    <!-- threshold / ground -->
    <path stroke-width="4" d="M168 356 Q256 361 344 356"/>
    <path stroke-width="2.5" opacity="0.6" d="M140 350 L166 352 M346 352 L372 350"/>

    <!-- constellation: open star (ring), linked chain, falling threads -->
    <circle cx="172" cy="152" r="10" stroke-width="4"/>
    <path stroke-width="1.8" opacity="0.7" d="M146 252 L154 198 L168 162
             M180 146 L204 122 L256 98 L308 120 L348 150 L366 196 L372 250"/>
    <path stroke-width="1.6" opacity="0.5" d="M154 198 L184 232 L178 300
             M366 196 L330 236 L336 302
             M204 122 L226 158 M308 120 L290 156"/>

    <!-- stars: filled -->
    <g fill="#B7D4F0" stroke="none">
      <circle cx="204" cy="122" r="5"/>
      <circle cx="256" cy="98"  r="5.5"/>
      <circle cx="308" cy="120" r="5"/>
      <circle cx="348" cy="150" r="4.5"/>
      <circle cx="366" cy="196" r="4"/>
      <circle cx="372" cy="250" r="3.5"/>
      <circle cx="154" cy="198" r="4"/>
      <circle cx="146" cy="252" r="3.5"/>
      <circle cx="226" cy="158" r="2.5"/>
      <circle cx="290" cy="156" r="2.5"/>
      <circle cx="330" cy="92"  r="2.5"/>
      <circle cx="184" cy="92"  r="2"/>
      <circle cx="394" cy="170" r="2"/>
      <circle cx="124" cy="170" r="2"/>
    </g>
    <!-- small open stars -->
    <circle cx="330" cy="236" r="4" stroke-width="2"/>
    <circle cx="184" cy="232" r="3.5" stroke-width="2"/>
  </g>
</svg>
